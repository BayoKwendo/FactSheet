plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.HIVFactsheet'
    compileSdk 35

    defaultConfig {
        applicationId "com.HIVFactsheet"
        minSdk 21
        targetSdk 36
        versionCode 301
        versionName "3.0.1"
        vectorDrawables { useSupportLibrary true }
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            // Credentials are supplied at build time (–P flags, env vars, or
            // ~/.gradle/gradle.properties) so no secrets live in this file.
            def ksPath = findProperty('FS_KEYSTORE') ?: System.getenv('FS_KEYSTORE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword findProperty('FS_STORE_PASSWORD') ?: System.getenv('FS_STORE_PASSWORD')
                keyAlias findProperty('FS_KEY_ALIAS') ?: System.getenv('FS_KEY_ALIAS')
                keyPassword findProperty('FS_KEY_PASSWORD') ?: System.getenv('FS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig false
    }

    lint {
        // False positive: this app uses ComponentActivity + Compose (no Fragments),
        // so registerForActivityResult is valid without the fragment library.
        disable 'InvalidFragmentVersionForActivityResult'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'DebugProbesKt.bin'] }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    // Extended icons are referenced individually and tree-shaken by R8 in release.
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // Google Play In-App Updates — enforces the latest published version.
    implementation 'com.google.android.play:app-update:2.1.0'
    // Play Services Location — in-app "turn on location" system dialog.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
